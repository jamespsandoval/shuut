openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SHUUT founder voice feed API
servers:
  - url: /api
    description: Base API path
tags:
  - { name: health, description: Health operations }
  - { name: auth, description: Email code authentication }
  - { name: feed, description: Social feed }
  - { name: profiles, description: Founder profiles }
  - { name: posts, description: Voice posts }
  - { name: social, description: Social actions }
  - { name: agent, description: Founder Ask Me agent }
  - { name: storage, description: Secure direct uploads }
  - { name: account, description: Account lifecycle }
  - { name: contact, description: Public contact form }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        '200':
          description: Healthy
          content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } }
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationInput' } } }
      responses:
        '202':
          description: Verification email sent
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthMessage' } } }
  /auth/start:
    post:
      operationId: startAuth
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '202':
          description: The appropriate sign-in or registration code was sent
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthStartResult' } } }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailCodeInput' } } }
      responses:
        '200':
          description: Email verified and session created
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
      responses:
        '202':
          description: Sign-in code sent when the account exists
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthMessage' } } }
  /auth/login/verify:
    post:
      operationId: verifyLogin
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailCodeInput' } } }
      responses:
        '200':
          description: Sign-in code verified and session created
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        '200':
          description: Current authenticated user
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
  /auth/passkey/register/options:
    post:
      operationId: beginPasskeyRegistration
      tags: [auth]
      responses:
        '200':
          description: WebAuthn registration options
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /auth/passkey/register/verify:
    post:
      operationId: completePasskeyRegistration
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnCredential' } } }
      responses:
        '200': { description: Passkey registered }
  /auth/passkey/assertion/options:
    post:
      operationId: beginPasskeyAssertion
      tags: [auth]
      responses:
        '200':
          description: WebAuthn assertion options
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
  /auth/passkey/assertion/verify:
    post:
      operationId: completePasskeyAssertion
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebAuthnCredential' } } }
      responses:
        '200': { description: Passkey verified }
  /auth/passkey/devices:
    get:
      operationId: listPasskeyDevices
      tags: [auth]
      responses:
        '200':
          description: Enrolled passkey devices
          content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyDeviceList' } } }
  /auth/passkey/devices/{credentialId}:
    delete:
      operationId: removePasskeyDevice
      tags: [auth]
      parameters:
        - { name: credentialId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Passkey removed }
  /auth/passkey/recovery/status:
    get:
      operationId: getPasskeyRecoveryStatus
      tags: [auth]
      responses:
        '200':
          description: Current recovery status
          content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyRecoveryStatus' } } }
  /auth/passkey/recovery/request:
    post:
      operationId: requestPasskeyRecovery
      tags: [auth]
      responses:
        '202':
          description: Recovery delay started
          content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyRecoveryStatus' } } }
  /auth/passkey/recovery/code:
    post:
      operationId: sendPasskeyRecoveryCode
      tags: [auth]
      responses:
        '202':
          description: Confirmation code sent
          content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyRecoveryStatus' } } }
  /auth/passkey/recovery/confirm:
    post:
      operationId: confirmPasskeyRecovery
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCodeInput' } } }
      responses:
        '200':
          description: Passkeys reset and sessions revoked
          content: { application/json: { schema: { type: object, required: [recovered], properties: { recovered: { type: boolean } } } } }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '204': { description: Session ended }
  /auth/onboarding:
    post:
      operationId: completeOnboarding
      tags: [auth]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingInput' } } }
      responses:
        '200':
          description: Profile created and onboarding completed
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
  /auth/usernames/{handle}/availability:
    get:
      operationId: checkUsernameAvailability
      tags: [auth]
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 30, pattern: '^[a-z0-9_]+$' }
      responses:
        '200':
          description: Username availability
          content: { application/json: { schema: { $ref: '#/components/schemas/UsernameAvailability' } } }
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      responses:
        '200':
          description: Account deletion state
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionResult' } } }
  /contact:
    post:
      operationId: sendContactMessage
      tags: [contact]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageInput'
      responses:
        '200':
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageResult'
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [everyone, following], default: everyone } }
      responses:
        '200':
          description: Feed
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Post' } } } }
  /profiles/{handle}:
    get:
      operationId: getProfile
      tags: [profiles]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Founder profile
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfileDetail' } } }
    patch:
      operationId: updateProfile
      tags: [profiles]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } }
      responses:
        '200':
          description: Updated founder profile
          content: { application/json: { schema: { $ref: '#/components/schemas/ProfileDetail' } } }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlRequest' } } }
      responses:
        '200':
          description: Presigned direct upload URL
          content: { application/json: { schema: { $ref: '#/components/schemas/UploadUrlResponse' } } }
  /transcriptions:
    post:
      operationId: transcribeAudio
      tags: [posts]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AudioTranscriptionInput' } } }
      responses:
        '200':
          description: Audio transcript
          content: { application/json: { schema: { $ref: '#/components/schemas/AudioTranscript' } } }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      parameters:
        - { name: objectPath, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Stored image
          content: { 'image/*': { schema: { type: string, format: binary } } }
  /posts:
    post:
      operationId: createPost
      tags: [posts]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PostInput' } } }
      responses:
        '201':
          description: Published post
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Post
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
    delete:
      operationId: deletePost
      tags: [posts]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Post deletion state
          content: { application/json: { schema: { $ref: '#/components/schemas/DeletionResult' } } }
    patch:
      operationId: updatePost
      tags: [posts]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PostEditInput' } } }
      responses:
        '200':
          description: Updated post
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
  /posts/{postId}/reaction:
    put:
      operationId: setReaction
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReactionInput' } } }
      responses:
        '200':
          description: Updated post
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
  /posts/{postId}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Ready voice comments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/VoiceComment' } }
    post:
      operationId: createPostComment
      tags: [posts]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VoiceCommentInput' } } }
      responses:
        '202':
          description: Voice comment accepted for transcription
          content: { application/json: { schema: { $ref: '#/components/schemas/VoiceCommentSubmission' } } }
  /comments/{commentId}/audio:
    get:
      operationId: getCommentAudio
      tags: [posts]
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Private comment audio
          content: { audio/*: { schema: { type: string, format: binary } } }
  /posts/{postId}/reshuut:
    post:
      operationId: reshuutPost
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Reshuuted post
          content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } }
  /posts/{postId}/share-link:
    post:
      operationId: createPostShareLink
      tags: [social]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Time-limited signed share link
          content: { application/json: { schema: { $ref: '#/components/schemas/PostShareLink' } } }
  /profiles/{handle}/follow:
    put:
      operationId: toggleFollow
      tags: [social]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Follow state
          content: { application/json: { schema: { $ref: '#/components/schemas/FollowState' } } }
  /profiles/{handle}/ask:
    post:
      operationId: askFounder
      tags: [agent]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AskInput' } } }
      responses:
        '200':
          description: Grounded answer
          content: { application/json: { schema: { $ref: '#/components/schemas/AskAnswer' } } }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: shu_session
  schemas:
    AuthUser:
      type: object
      required: [id, email, emailVerified, onboardingComplete, passkeyEnrolled, passkeyVerified]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        onboardingComplete: { type: boolean }
        passkeyEnrolled: { type: boolean }
        passkeyVerified: { type: boolean }
    AuthSession:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
    AuthMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    WebAuthnCredential:
      type: object
      additionalProperties: true
    PasskeyDevice:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    PasskeyDeviceList:
      type: object
      required: [devices]
      properties:
        devices: { type: array, items: { $ref: '#/components/schemas/PasskeyDevice' } }
    PasskeyRecoveryStatus:
      type: object
      required: [pending, availableAt, codeExpiresAt]
      properties:
        pending: { type: boolean }
        availableAt: { type: [string, 'null'], format: date-time }
        codeExpiresAt: { type: [string, 'null'], format: date-time }
    RecoveryCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    EmailCodeInput:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    LoginInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AuthStartResult:
      type: object
      required: [flow, message]
      properties:
        flow: { type: string, enum: [login, register] }
        message: { type: string }
    OnboardingInput:
      type: object
      required: [firstName, lastName, handle]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 40 }
        lastName: { type: string, minLength: 1, maxLength: 40 }
        handle: { type: string, minLength: 2, maxLength: 30, pattern: '^[a-z0-9_]+$' }
    UsernameAvailability:
      type: object
      required: [handle, available]
      properties:
        handle: { type: string }
        available: { type: boolean }
    ContactMessageInput:
      type: object
      required: [firstName, lastName, email, message, consent]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        message: { type: string, minLength: 1, maxLength: 1000 }
        consent: { type: boolean, const: true }
        website: { type: string, maxLength: 0 }
    ContactMessageResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean, const: true }
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    DeletionResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [completed, pending, failed] }
    Founder:
      type: object
      required: [id, name, handle, bio, avatarColor, isFollowing, previewTranscript]
      properties:
        id: { type: integer }
        name: { type: string }
        handle: { type: string }
        bio: { type: string }
        avatarColor: { type: string }
        avatarUrl: { type: [string, 'null'] }
        location: { type: [string, 'null'] }
        website: { type: [string, 'null'] }
        isFollowing: { type: boolean }
        previewTranscript: { type: boolean }
    ReactionSummary:
      type: object
      required: [rocket, laughing, thumbsDown]
      properties:
        rocket: { type: integer }
        laughing: { type: integer }
        thumbsDown: { type: integer }
    Post:
      type: object
      required: [id, author, transcript, durationSeconds, createdAt, reactions, isReshuuted, canEdit, editableUntil]
      properties:
        id: { type: integer }
        author: { $ref: '#/components/schemas/Founder' }
        transcript: { type: string }
        audioUrl: { type: [string, 'null'] }
        durationSeconds: { type: integer }
        createdAt: { type: string, format: date-time }
        reactions: { $ref: '#/components/schemas/ReactionSummary' }
        viewerReaction: { type: [string, 'null'], enum: [rocket, laughing, thumbsDown, null] }
        isReshuuted: { type: boolean }
        reshuutedBy: { type: [string, 'null'] }
        canEdit: { type: boolean }
        editableUntil: { type: [string, 'null'], format: date-time }
    ProfileDetail:
      type: object
      required: [founder, followerCount, followingCount, postCount, posts, suggestedQuestions]
      properties:
        founder: { $ref: '#/components/schemas/Founder' }
        followerCount: { type: integer }
        followingCount: { type: integer }
        postCount: { type: integer }
        posts: { type: array, items: { $ref: '#/components/schemas/Post' } }
        suggestedQuestions: { type: array, items: { type: string } }
    ProfileUpdate:
      type: object
      required: [name, handle, bio]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        handle: { type: string, minLength: 2, maxLength: 30, pattern: '^[A-Za-z0-9_]+$' }
        bio: { type: string, maxLength: 240 }
        location: { type: string, maxLength: 80 }
        website: { type: string, maxLength: 200 }
        avatarObjectPath: { type: string, pattern: '^/objects/uploads/[A-Za-z0-9-]+$' }
        previewTranscript: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 15000000 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, audio/webm, audio/mp4, audio/mpeg, audio/ogg] }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    PostInput:
      type: object
      required: [audioObjectPath, durationSeconds]
      properties:
        transcript: { type: string, minLength: 1, maxLength: 5000 }
        audioObjectPath: { type: string, pattern: '^/objects/uploads/[A-Za-z0-9-]+$' }
        durationSeconds: { type: integer, minimum: 1, maximum: 90 }
    PostEditInput:
      type: object
      required: [transcript]
      properties:
        transcript: { type: string, minLength: 1, maxLength: 5000 }
    VoiceCommentInput:
      type: object
      required: [audioObjectPath, durationSeconds]
      properties:
        audioObjectPath: { type: string, pattern: '^/objects/uploads/[A-Za-z0-9-]+$' }
        durationSeconds: { type: integer, minimum: 1, maximum: 90 }
    VoiceCommentSubmission:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string, enum: [processing] }
    VoiceComment:
      type: object
      required: [id, author, transcript, audioUrl, durationSeconds, createdAt]
      properties:
        id: { type: integer }
        author: { $ref: '#/components/schemas/Founder' }
        transcript: { type: string }
        audioUrl: { type: string }
        durationSeconds: { type: integer }
        createdAt: { type: string, format: date-time }
    PostShareLink:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    AudioTranscriptionInput:
      type: object
      required: [audioObjectPath]
      properties:
        audioObjectPath: { type: string, pattern: '^/objects/uploads/[A-Za-z0-9-]+$' }
    AudioTranscript:
      type: object
      required: [transcript]
      properties:
        transcript: { type: string }
    ReactionInput:
      type: object
      required: [emojiType]
      properties:
        emojiType: { type: string, enum: [rocket, laughing, thumbsDown] }
    FollowState:
      type: object
      required: [isFollowing, followerCount]
      properties:
        isFollowing: { type: boolean }
        followerCount: { type: integer }
    AskInput:
      type: object
      required: [question]
      properties: { question: { type: string, minLength: 2 } }
    SourcePost:
      type: object
      required: [postId, excerpt, createdAt]
      properties:
        postId: { type: integer }
        excerpt: { type: string }
        createdAt: { type: string, format: date-time }
    AskAnswer:
      type: object
      required: [answer, sources, hasEnoughContext]
      properties:
        answer: { type: string }
        sources: { type: array, items: { $ref: '#/components/schemas/SourcePost' } }
        hasEnoughContext: { type: boolean }
